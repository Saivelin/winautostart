name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a preset with ...
        2. Click Launch
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WinAutoStart version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Settings → Log opens `%APPDATA%\WinAutoStart\log.txt`. Paste the relevant lines (remove anything private).
      render: text
  - type: textarea
    id: config
    attributes:
      label: Preset (optional)
      description: Export your presets (Settings → Export) and paste the affected one, with private paths/URLs removed.
      render: json
